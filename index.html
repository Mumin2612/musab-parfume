<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MUS'AB PARFUME</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1 class="logo">MUS'AB IBN 'UMAYR</h1>
            <p class="tagline">Premium Oils • Warsaw</p>
        </header>

        <div id="catalog" class="catalog-grid"></div>

        <!-- Нижняя плашка -->
        <div id="cart-bar" class="cart-bar" onclick="showCart()">
            <span id="bar-count">0 шт.</span>
            <span>ПОСМОТРЕТЬ ЗАКАЗ</span>
            <span id="bar-total">0 zł</span>
        </div>

        <!-- ПОЛНОЭКРАННАЯ ФОРМА КОРЗИНЫ -->
        <div id="cart-overlay" class="overlay">
            <div class="overlay-header">
                <h2>Ваш заказ</h2>
                <button class="close-btn" onclick="hideCart()">✕</button>
            </div>
            
            <div id="cart-list" class="cart-list">
                <!-- Сюда JS вставит товары -->
            </div>
            
            <div class="checkout-footer">
                <div class="total-row">
                    <span>Итого к оплате:</span>
                    <span id="overlay-total">0 zł</span>
                </div>
                <div class="order-info">
                    <p>После подтверждения мы свяжемся с вами в Telegram для уточнения доставки.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <script src="app.js" defer></script>
</body>
</html>
