<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MUS'AB PARFUME</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1 class="logo">MUS'AB IBN 'UMAYR</h1>
            <p class="tagline">Premium Oils • Warsaw</p>
        </header>

        <div id="catalog" class="catalog-grid"></div>

        <!-- Нижняя плашка -->
        <div id="cart-bar" class="cart-bar" onclick="showCart()" style="display: none;">
            <span id="bar-count">0 шт.</span>
            <span>ПОСМОТРЕТЬ ЗАКАЗ</span>
            <span id="bar-total">0 zł</span>
        </div>

        <!-- Корзина -->
        <div id="cart-overlay" class="overlay">
            <div class="overlay-header">
                <h2>Ваш заказ</h2>
                <button class="close-btn" onclick="hideCart()">✕</button>
            </div>
            
            <div id="cart-list" class="cart-list"></div>
            
            <div class="checkout-footer">
                <div class="total-row">
                    <span>Итого к оплате:</span>
                    <span id="overlay-total">0 zł</span>
                </div>
                
                <button id="process-order-btn" class="buy-btn" style="margin-top: 15px; width: 100%; display: none;" onclick="sendOrder()">
                    ПОДТВЕРДИТЬ ЗАКАЗ
                </button>
                
                <div class="order-info">
                    <p>После нажатия данные будут отправлены в чат с ботом.</p>
                </div>
            </div>
        </div>

        <!-- Модальное окно для детального просмотра товара -->
        <div id="product-modal" class="product-modal" onclick="closeModal(event)">
            <div class="modal-content" onclick="event.stopPropagation()">
                <button class="modal-close" onclick="closeModal()">✕</button>
                <div class="modal-body">
                    <img id="modal-img" src="" alt="">
                    <h2 id="modal-title"></h2>
                    <p id="modal-desc"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Загружаем SDK Телеграма -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="app.js"></script>
</body>
</html>
