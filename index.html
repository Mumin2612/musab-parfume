<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Musab Parfume</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 10px; }
        .catalog { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding-bottom: 80px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; }
        h3 { font-size: 14px; margin: 5px 0; color: #d4af37; }
        .price-tag { font-weight: bold; margin: 10px 0; color: #fff; }
        .buy-btn { background: #d4af37; color: #000; border: none; padding: 8px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .vol-btn { background: #333; color: #fff; border: 1px solid #44; margin: 2px; padding: 4px; font-size: 10px; border-radius: 3px; }
        .vol-btn.active { background: #d4af37; color: #000; }
        #cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1a1a1a; padding: 15px; display: none; justify-content: space-between; border-top: 1px solid #d4af37; z-index: 100; }
    </style>
</head>
<body>

    <h2 style="text-align: center; color: #d4af37;">MUS'AB PARFUME</h2>
    <div id="catalog" class="catalog"></div>

    <div id="cart-bar">
        <span id="bar-count">0 шт.</span>
        <b id="bar-total">0 zł</b>
    </div>

    <!-- Сначала библиотека Телеграм -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Потом твой скрипт -->
    <script src="app.js"></script>
</body>
</html>
